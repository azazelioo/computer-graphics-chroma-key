name: Submission image archive
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ready-to-load AMD64 image
        run: bash scripts/export-image.sh linux/amd64
      - name: Verify the built image
        run: |
          docker image rm kg-chroma-key:submission-20261003
          docker load -i outputs/chroma-key-amd64.tar.gz
          docker run -d --name submission-test --read-only --tmpfs /tmp:size=256m,mode=1777 --tmpfs /data:size=2g,mode=1777 --memory=2g kg-chroma-key:submission-20261003
          docker exec -i submission-test python < smoke.py
      - name: Publish downloadable image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create submission-20261003 --target "$GITHUB_SHA" --title "Ready Docker image for homework 4" --notes "Docker image for Linux amd64. Download the archive, run docker load -i chroma-key-amd64.tar.gz, then docker compose -f compose.image.yaml up -d --wait. Coursework submission still requires the assigned GitLab MIEM repository." outputs/chroma-key-amd64.tar.gz outputs/chroma-key-amd64.tar.gz.sha256 compose.image.yaml
