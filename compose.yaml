name: kg-chroma-key
services:
  web:
    build: .
    ports:
      - "127.0.0.1:8004:8004"
    volumes:
      - media:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: 2g
    cpus: 2
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
volumes:
  media:
